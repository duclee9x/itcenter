services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: itcenter
      POSTGRES_USER: itcenter
      POSTGRES_PASSWORD: ${ITCENTER_LOCAL_DB_PASSWORD:?Supply a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itcenter -d itcenter"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
