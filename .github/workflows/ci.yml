name: Bootstrap CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release-candidate identifier
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bootstrap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-test-only@localhost:5432/bootstrap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Podman Compose manifest validator
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
      - run: bash tests/deployment/compose-config.sh
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-build
          path: |
            dist/
            contracts/
            database/migrations/
            package.json
            package-lock.json

  publish-oci:
    if: github.event_name == 'workflow_dispatch' && github.ref_protected == true
    needs: verify
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/duclee9x/itcenter
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm committed build source
        run: test -z "$(git status --porcelain)"
      - name: Capture build provenance fields
        id: build-info
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable release candidate image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build-info.outputs.built_at }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create and commit RC provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_TIME: ${{ steps.build-info.outputs.built_at }}
        run: |
          LOCKFILE_SHA="$(sha256sum package-lock.json | awk '{print $1}')"
          node deploy/scripts/create-rc-metadata.mjs \
            "$RELEASE_ID" "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" \
            "$GITHUB_SHA" "$BUILD_TIME" \
            "$WORKFLOW_URL" "$LOCKFILE_SHA" "release/rc/$RELEASE_ID.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release/rc/$RELEASE_ID.json"
          git commit -m "Record release candidate $RELEASE_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
