services:
  api:
    environment:
      APP_ENV: staging

  agent-gateway:
    environment:
      APP_ENV: staging
    ports:
      - "${AGENT_BIND_ADDRESS:-0.0.0.0}:${AGENT_HOST_PORT:-13001}:3001"

  worker:
    environment:
      APP_ENV: staging

  migrate:
    environment:
      APP_ENV: staging

  caddy:
    ports:
      - "${STAGING_API_BIND_ADDRESS:-127.0.0.1}:${STAGING_HTTP_PORT:-8080}:80"
      - "${STAGING_API_BIND_ADDRESS:-127.0.0.1}:${STAGING_HTTPS_PORT:-8443}:443"
      - "${STAGING_API_BIND_ADDRESS:-127.0.0.1}:${STAGING_HTTPS_PORT:-8443}:443/udp"
