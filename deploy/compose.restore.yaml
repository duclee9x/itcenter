services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set immutable POSTGRES_IMAGE}
    restart: "no"
    environment:
      POSTGRES_DB: ${RESTORE_POSTGRES_DB:?Set RESTORE_POSTGRES_DB}
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:?Set RESTORE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?Set RESTORE_POSTGRES_PASSWORD}
    volumes:
      - restore_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [restore]

volumes:
  restore_postgres_data:

networks:
  restore:
    internal: true
