services:
  api:
    environment:
      APP_ENV: production

  agent-gateway:
    environment:
      APP_ENV: production
    ports:
      - "${AGENT_BIND_ADDRESS:-0.0.0.0}:${AGENT_HOST_PORT:-3001}:3001"

  worker:
    environment:
      APP_ENV: production

  migrate:
    environment:
      APP_ENV: production

  caddy:
    ports:
      - "${PRODUCTION_API_BIND_ADDRESS:-0.0.0.0}:${PRODUCTION_HTTP_PORT:-80}:80"
      - "${PRODUCTION_API_BIND_ADDRESS:-0.0.0.0}:${PRODUCTION_HTTPS_PORT:-443}:443"
      - "${PRODUCTION_API_BIND_ADDRESS:-0.0.0.0}:${PRODUCTION_HTTPS_PORT:-443}:443/udp"
